<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <style>
      @import url("https://portal.pickfords.com/assets/fonts/HelveticaNeueLTStdRoman.woff");

      body {
        font-family: HelveticaNeueLTStdRoman, Verdana, Geneva, sans-serif;
        line-height: 25px;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <table
      aligngn="center"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #e5e5e5; width: 100%"
    >
      <tbody>
        <tr>
          <td>
            <table
              cellpadding="0"
              cellspacing="0"
              style="width: 600px"
              align="center"
            >
              <tbody>
                <tr>
                  <td style="padding: 15px 0"></td>
                </tr>
                <tr>
                  <td style="background-color: white; border-radius: 5px">
                    <table
                      width="100%"
                      align="center"
                      cellpadding="0"
                      cellspacing="0"
                      style="
                        font-family: HelveticaNeueLTStdRoman, Verdana, Geneva,
                          sans-serif;
                        text-align: center;
                      "
                    >
                      <tr>
                        <td style="padding: 20px 15px; text-align: right">
                          <img
                            style="height: 50px"
                            src="##LogoURL##"
                            alt="SampleBackend"
                          />
                        </td>
                      </tr>
                      <tr style="text-align: left">
                        <td style="padding-left: 22px; padding-bottom: 15px">
                          Dear <b>##UserName##</b>
                        </td>
                      </tr>
                      <tr>
                        <td
                          style="
                            font-size: 16px;
                            font-weight: 300;
                            padding: 0px 5px;
                          "
                        >
                          Click on the button below to log directly into the application
                        </td>
                      </tr>
                      <tr>
                        <td
                          style="
                            text-align: center;
                            padding-top: 18px;
                            padding-bottom: 10px;
                          "
                        >
                          <a
                            href="##ResetPasswordLink##"
                            style="
                              padding: 0.875rem 1.5rem;
                              background-color: #f2c342;
                              color: white;
                              text-decoration: none;
                              display: inline-block;
                              border-radius: 20px;
                            "
                          >
                            Click Here
                          </a>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-top: 25px; font-size: 14px">
                          <b>
                            <u> Please note: </u>
                          </b>
                          <span style="color: #ff0000">
                            This link will expire in 15 minutes
                          </span>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <span style="font-size: 12px">
                            If there is an issue with the button, please copy
                            this link in to your browser.
                            <br />
                            <a
                              style="color: lightskyblue"
                              href="##ResetPasswordLink##"
                              >##ResetPasswordLink##</a
                            >
                          </span>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <p><b>SampleBackend Team</b></p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="height: 20px"></td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
